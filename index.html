<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期货仓位计算软件</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
    background: #d6dde5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .window {
    width: 420px;
    background: #f0f0f0;
    border: 1px solid #b8c0cc;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }
  .titlebar {
    background: linear-gradient(90deg, #2b5ea7, #3f8ad8);
    color: #fff;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .titlebar .title { display: flex; align-items: center; gap: 6px; }
  .titlebar .globe {
    width: 16px; height: 16px;
    background: radial-gradient(circle at 35% 30%, #a8d8ff, #1a5fb4);
    border-radius: 50%;
    display: inline-block;
  }
  .titlebar .btns { display: flex; gap: 4px; }
  .titlebar .btns span {
    width: 22px; height: 20px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    font-size: 12px;
    text-align: center;
    line-height: 20px;
    cursor: pointer;
    user-select: none;
  }
  .titlebar .btns span:hover { background: rgba(255,255,255,0.35); }
  .body { padding: 16px 20px 20px; }
  .tip {
    color: #808080;
    font-size: 12px;
    margin-bottom: 14px;
  }
  .field {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }
  .field label {
    width: 90px;
    text-align: right;
    padding-right: 10px;
    font-size: 14px;
    color: #333;
    white-space: nowrap;
  }
  .field input[type="number"] {
    flex: 1;
    height: 30px;
    padding: 0 8px;
    border: 1px solid #b8c0cc;
    border-radius: 4px;
    font-size: 14px;
    background: #fff;
    outline: none;
  }
  .field input[type="number"]:focus { border-color: #3f8ad8; }
  .field input[type="number"].invalid { border-color: #e03131; background: #fff0f0; }
  .slider-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
  .slider-wrap input[type="range"] {
    flex: 1;
    accent-color: #2b5ea7;
  }
  .slider-val {
    width: 52px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    color: #2b5ea7;
    background: #fff;
    border: 1px solid #b8c0cc;
    border-radius: 4px;
    padding: 3px 0;
  }
  .row {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }
  .btn-calc {
    flex: 1;
    height: 34px;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(180deg, #4fc3f7, #0078d7);
    box-shadow: 0 2px 4px rgba(0, 90, 160, 0.35);
    transition: filter 0.15s;
  }
  .btn-calc:hover { filter: brightness(1.08); }
  .btn-calc:active { filter: brightness(0.92); }
  .result {
    margin-top: 18px;
    background: #e2e2e2;
    border-radius: 4px;
    padding: 12px 14px;
    font-size: 16px;
    color: #000;
    text-align: center;
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: break-all;
  }
  .result .num { font-weight: bold; color: #0b5cab; }
  .error { color: #c92a2a !important; }
  .footer-note {
    margin-top: 10px;
    font-size: 11px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="title"><span class="globe"></span>期货仓位计算软件</div>
    <div class="btns"><span>—</span><span>□</span><span>×</span></div>
  </div>
  <div class="body">
    <div class="tip">[提示：交易单位指每手合约代表的商品数量]</div>

    <div class="field">
      <label>账户余额：</label>
      <input type="number" id="balance" value="50000" min="0" step="any" placeholder="请输入金额">
    </div>

    <div class="field">
      <label>风险比例：</label>
      <div class="slider-wrap">
        <input type="range" id="riskSlider" min="0" max="100" step="0.1" value="2">
        <span class="slider-val" id="riskVal">2%</span>
      </div>
    </div>

    <div class="field">
      <label>入场价格：</label>
      <input type="number" id="entryPrice" value="3250" min="0" step="any" placeholder="请输入价格">
    </div>

    <div class="field">
      <label>止损价格：</label>
      <input type="number" id="stopPrice" value="3230" min="0" step="any" placeholder="请输入价格">
    </div>

    <div class="row">
      <div style="display:flex;align-items:center;flex:1;">
        <label style="width:90px;text-align:right;padding-right:10px;font-size:14px;color:#333;white-space:nowrap;">交易单位：</label>
        <input type="number" id="unit" value="10" min="0" step="any" placeholder="每手数量" style="flex:1;height:30px;padding:0 8px;border:1px solid #b8c0cc;border-radius:4px;font-size:14px;background:#fff;outline:none;">
      </div>
      <button class="btn-calc" id="calcBtn" style="width:110px;margin-left:10px;flex:none;">自动计算</button>
    </div>

    <div class="result" id="result">此单最佳合约数为：<span class="num">5</span> 手</div>
    <div class="footer-note">计算结果仅供参考，实际交易请结合自身风险承受能力</div>
  </div>
</div>

<script>
(function () {
  var balanceEl = document.getElementById('balance');
  var riskSlider = document.getElementById('riskSlider');
  var riskVal = document.getElementById('riskVal');
  var entryEl = document.getElementById('entryPrice');
  var stopEl = document.getElementById('stopPrice');
  var unitEl = document.getElementById('unit');
  var calcBtn = document.getElementById('calcBtn');
  var resultEl = document.getElementById('result');

  var inputs = [balanceEl, entryEl, stopEl, unitEl];

  // 滑块联动百分比显示
  riskSlider.addEventListener('input', function () {
    riskVal.textContent = parseFloat(riskSlider.value) + '%';
  });

  // 清空非法样式
  inputs.forEach(function (el) {
    el.addEventListener('input', function () { el.classList.remove('invalid'); });
  });

  function isInvalidNumber(v) {
    return v === null || v === '' || isNaN(v);
  }

  function calc() {
    // 校验输入
    var balance = parseFloat(balanceEl.value);
    var risk = parseFloat(riskSlider.value);
    var entry = parseFloat(entryEl.value);
    var stop = parseFloat(stopEl.value);
    var unit = parseFloat(unitEl.value);

    var valid = true;
    inputs.forEach(function (el) { el.classList.remove('invalid'); });

    if (isInvalidNumber(balance) || balance <= 0) {
      balanceEl.classList.add('invalid'); valid = false;
    }
    if (isInvalidNumber(risk) || risk <= 0) {
      valid = false;
    }
    if (isInvalidNumber(entry) || entry <= 0) {
      entryEl.classList.add('invalid'); valid = false;
    }
    if (isInvalidNumber(stop) || stop <= 0) {
      stopEl.classList.add('invalid'); valid = false;
    }
    if (isInvalidNumber(unit) || unit <= 0) {
      unitEl.classList.add('invalid'); valid = false;
    }
    if (entry > 0 && stop > 0 && entry === stop) {
      entryEl.classList.add('invalid');
      stopEl.classList.add('invalid');
      valid = false;
    }

    if (!valid) {
      resultEl.className = 'result error';
      resultEl.textContent = '请输入正确的数值';
      return;
    }

    // 计算逻辑
    var maxLossPerTrade = balance * (risk / 100);                 // 单笔最大可亏损
    var lossPerContract = Math.abs(entry - stop) * unit;          // 每手合约最大亏损
    var lots = Math.floor(maxLossPerTrade / lossPerContract);     // 最佳合约手数（向下取整）

    resultEl.className = 'result';
    resultEl.innerHTML = '此单最佳合约数为：<span class="num">' + lots + '</span> 手';
  }

  calcBtn.addEventListener('click', calc);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') calc();
  });

  // 页面加载即按默认值计算一次
  calc();
})();
</script>
</body>
</html>
